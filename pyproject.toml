[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "onionnet"
version = "1.1.0"
description = "A package for creating and analysing large mulilayered networks using graph-tool."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Macabe Daley" }]
keywords = ["graph-tool", "networks", "multilayer", "analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
# graph-tool is typically installed via conda; leave as optional
graph = ["graph-tool"]

[tool.hatch.build.targets.wheel]
packages = ["onionnet"]

[tool.hatch.build.targets.sdist]
include = ["onionnet", "README.md", "LICENSE"]

# -------------------------
# Ruff: formatter + linter
# -------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "build", "dist", "__pycache__", "docs/_build", "node_modules", "docs/**.ipynb",]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes (real bugs)
  "I",  # import sorting (replaces isort)
  "UP", # safe pyupgrade modernizations
  "B",     # flake8-bugbear (correctness)
  "C4",    # comprehensions (readability/speed)
  "SIM",   # flake8-simplify
  "PERF",  # perflint (micro perf wins)
  "RUF",   # ruff-native rules (e.g., RUF100 for stray noqa)
  "TCH",   # type-checking imports hygiene (TYPE_CHECKING blocks)
  "FA",    # future-annotations (FA102 ensures it's at top)
]
ignore = ["E501"]  # let the formatter wrap long lines

[tool.ruff.lint.isort]
known-first-party = ["onionnet"]
force-sort-within-sections = true
combine-as-imports = true
# If you rely on runtime import side-effects in a few modules, we’ll pin them below.

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E402"]     # path hacks need early imports
"onionnet/**/__init__.py" = ["F401","I001"]
"tests/**" = ["S101","PT011","PT012","RET504"]
